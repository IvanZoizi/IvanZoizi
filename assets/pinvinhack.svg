  <rect x="56" y="152" width="120" height="5" rx="2.5" fill="#8A5CF6"/>

  <!-- tagline -->
  <text x="54" y="190" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" fill="#aeb8c8">AI call-analytics API &amp; dashboard</text>

  <!-- tags -->
  <g transform="translate(54,232)"><rect x="0" y="0" width="93" height="30" rx="15" fill="#ffffff" fill-opacity="0.08" stroke="#8A5CF6" stroke-opacity="0.55" stroke-width="1.2"/><text x="46" y="20" text-anchor="middle" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" fill="#e8ecf4">FastAPI</text></g>
    <g transform="translate(159,232)"><rect x="0" y="0" width="83" height="30" rx="15" fill="#ffffff" fill-opacity="0.08" stroke="#8A5CF6" stroke-opacity="0.55" stroke-width="1.2"/><text x="42" y="20" text-anchor="middle" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" fill="#e8ecf4">Pandas</text></g>
    <g transform="translate(254,232)"><rect x="0" y="0" width="83" height="30" rx="15" fill="#ffffff" fill-opacity="0.08" stroke="#8A5CF6" stroke-opacity="0.55" stroke-width="1.2"/><text x="42" y="20" text-anchor="middle" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" fill="#e8ecf4">OpenAI</text></g>
    <g transform="translate(349,232)"><rect x="0" y="0" width="83" height="30" rx="15" fill="#ffffff" fill-opacity="0.08" stroke="#8A5CF6" stroke-opacity="0.55" stroke-width="1.2"/><text x="42" y="20" text-anchor="middle" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" fill="#e8ecf4">ffmpeg</text></g>
